[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "glucose-guardian"
version = "0.1.0"
description = "Supplementary CGM display and alarm prototype"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = ["pyserial==3.5"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
lint = ["ruff==0.17.4", "mypy==2.4.1", "types-pyserial==3.5.0.20261104"]

[project.scripts]
glucose-guardian = "glucose_guardian.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.mypy]
strict = true
