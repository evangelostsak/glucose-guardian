# Synthetic development values only. Not clinical recommendations.
provider = "dexcom_share"
[alarm]
urgent_low_mg_dl = 55
low_mg_dl = 70
high_mg_dl = 250
hysteresis_mg_dl = 5
rearm_mg_dl = 10
max_age_s = 600
max_future_skew_s = 60
heartbeat_timeout_s = 5
glucose_acknowledgement_s = 60
fault_acknowledgement_s = 60
[runtime]
tick_s = 1
fetch_interval_s = 60
fetch_timeout_s = 20
clock_check_interval_s = 60
clock_check_timeout_s = 5
[dexcom]
server = "ous"
login_min_interval_s = 300
rate_limit_initial_s = 120
rate_limit_max_s = 1800
request_timeout_s = 5
state_file = "/var/lib/glucose-guardian/dexcom-share-state.json"
[transport]
kind = "simulated"
[display]
kind = "snapshot"
snapshot_file = "/run/glucose-guardian/display.json"
snapshot_max_age_s = 5
refresh_s = 1
last_known_cutoff_s = 1800
framebuffer = "/dev/fb0"
font_file = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
[hardware]
outputs_enabled = false
