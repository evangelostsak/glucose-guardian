[platformio]
default_envs = uno

[env:uno]
platform = atmelavr@5.1.0
board = uno
framework = arduino
monitor_speed = 115200

[env:uno-watchdog-test]
extends = env:uno
build_flags = -DGUARDIAN_WATCHDOG_TEST

[env:native]
platform = native@1.2.1
test_framework = unity
build_flags = -std=c++11 -Wall -Wextra -Werror -pedantic
